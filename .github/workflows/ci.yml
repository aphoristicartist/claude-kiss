name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck bin/claude-kiss install.sh tests/test.sh build-release.sh

      - name: Ruff
        run: pipx run --spec ruff==0.16.4 ruff check evals/run_evals.py

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code

      - name: Syntax checks
        run: |
          sh -n bin/claude-kiss install.sh tests/test.sh build-release.sh
          python3 -m py_compile evals/run_evals.py
          python3 -m json.tool config/settings.json >/dev/null

      - name: Integration tests
        run: ./tests/test.sh

      - name: Build release archive
        run: ./build-release.sh
